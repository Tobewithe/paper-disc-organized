<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660"><rect width="1280" height="660" fill="#f5f8fc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#647b91"/></marker></defs><g font-family="Microsoft YaHei, sans-serif"><text x="35" y="48" fill="#17354f" font-size="29" font-weight="bold">方法结构与本轮实际验证范围</text><rect x="35" y="100" width="230" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="53" y="140" font-size="23" fill="#183b54">视频帧</text><text x="53" y="173" font-size="18" fill="#667f95">当前与过去</text><rect x="315" y="100" width="250" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="333" y="140" font-size="23" fill="#183b54">冻结 YOLO26-seg</text><text x="333" y="173" font-size="18" fill="#667f95">框、掩码、外观特征</text><rect x="615" y="100" width="250" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="633" y="140" font-size="23" fill="#183b54">身份投影</text><text x="633" y="173" font-size="18" fill="#667f95">共享64维嵌入</text><rect x="315" y="295" width="250" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="333" y="335" font-size="23" fill="#183b54">运动关联 B</text><text x="333" y="368" font-size="18" fill="#667f95">保留当前高分对应</text><rect x="615" y="295" width="250" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="633" y="335" font-size="23" fill="#183b54">外观候选 A</text><text x="633" y="368" font-size="18" fill="#667f95">IoU与相似度限制</text><rect x="915" y="295" width="325" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="933" y="335" font-size="23" fill="#183b54">竞争关联组</text><text x="933" y="368" font-size="18" fill="#667f95">整体选择，保持一对一</text><rect x="915" y="505" width="325" height="100" rx="14" fill="white" stroke="#bed0e2"/><text x="933" y="545" font-size="23" fill="#183b54">个体 ID 与轨迹</text><text x="933" y="578" font-size="18" fill="#667f95">可视化与完整评价</text><path d="M265 150 H315" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><path d="M565 150 H615" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><path d="M740 200 V295" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><path d="M440 200 V295" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><path d="M565 345 H615" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><path d="M865 345 H915" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><path d="M1077 395 V505" fill="none" stroke="#647b91" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="455" width="800" height="150" rx="14" fill="#e5eff8"/><text x="55" y="491" font-size="21" fill="#175071">比较三种决策：单帧收益 / 12帧轨迹收益 / 保护式补接</text><text x="55" y="529" font-size="19" fill="#36556c">12帧GT仅用于离线训练标签；部署推理不读取未来帧或GT。</text><text x="55" y="565" font-size="19" fill="#36556c">保护式补接不新增参数；保护当前高分对应不等于整段轨迹无损。</text></g></svg>