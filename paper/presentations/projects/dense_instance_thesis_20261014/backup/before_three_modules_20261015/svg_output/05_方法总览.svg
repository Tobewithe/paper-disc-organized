<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">02 研究方法</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">研究方法分为三个模块</text></g>
<g id="evaluation-module" data-pptx-bounds="64 190 1152 114"><text x="64" y="222" font-size="22" fill="#315E9D">模块一</text><text x="190" y="222" font-size="32" font-weight="bold" fill="#315E9D">实例级评价与失败定位</text><text x="190" y="277" fill="#25374C">从同一检测结果出发，区分框与轮廓的错误。</text><text x="1216" y="222" font-size="22" text-anchor="end" fill="#596B80">06—07</text></g>
<g id="exploration-module" data-pptx-bounds="64 331 1152 114"><line x1="64" y1="332" x2="1216" y2="332" stroke="#D4DEE7" /><text x="64" y="378" font-size="22" fill="#007F82">模块二</text><text x="190" y="378" font-size="32" font-weight="bold" fill="#007F82">轮廓修正的探索实验</text><text x="190" y="430" fill="#25374C">先测可改进空间，再检查自动修正的实际效果。</text><text x="1216" y="378" font-size="22" text-anchor="end" fill="#596B80">08—09</text></g>
<g id="risk-module" data-pptx-bounds="64 484 1152 114"><line x1="64" y1="485" x2="1216" y2="485" stroke="#D4DEE7" /><text x="64" y="531" font-size="22" fill="#C36D37">模块三</text><text x="190" y="531" font-size="32" font-weight="bold" fill="#172B46">修正风险与适用范围</text><text x="190" y="583" fill="#25374C">分析哪些个体容易受损，再提出选择性应用方案。</text><text x="1216" y="531" font-size="22" text-anchor="end" fill="#596B80">10—12</text></g>
