<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">04 通用系统设计与应用</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">以猪只群体监测开展应用验证</text></g>
<g id="case-position" data-pptx-bounds="64 174 1152 68"><text x="64" y="211" font-size="32" fill="#172B46">密集聚集、外观相似与频繁遮挡，构成连续个体分析的具体场景。</text></g>
<g id="data-and-labels" data-pptx-bounds="64 268 352 267"><rect x="64" y="268" width="352" height="267" fill="#F1F5F8" /><text x="88" y="315" font-size="32" font-weight="bold" fill="#172B46">数据与标注</text><text font-size="22" fill="#25374C" x="88" y="364">复用已有动物静态图像</text><text font-size="22" fill="#25374C" x="88" y="404">新增连续视频与跨帧身份</text><text font-size="22" fill="#25374C" x="88" y="444">标注遮挡、重现与可见性</text><text font-size="22" fill="#25374C" x="88" y="484">按视频分组，隔离开发与评价</text></g>
<g id="controlled-comparison" data-pptx-bounds="464 268 352 267"><rect x="464" y="268" width="352" height="267" fill="#F1F5F8" /><text x="488" y="315" font-size="32" font-weight="bold" fill="#172B46">方法对照</text><text font-size="22" fill="#25374C" x="488" y="364">固定跟踪器及关联参数</text><text font-size="22" fill="#25374C" x="488" y="404">比较基线、单模块与组合</text><text font-size="22" fill="#25374C" x="488" y="444">按密度、遮挡时长分层</text><text font-size="22" fill="#25374C" x="488" y="484">分别分析空间与身份收益</text></g>
<g id="application-evaluation" data-pptx-bounds="864 268 352 267"><rect x="864" y="268" width="352" height="267" fill="#F1F5F8" /><text x="888" y="315" font-size="32" font-weight="bold" fill="#172B46">应用评价</text><text font-size="22" fill="#25374C" x="888" y="364">检测分割与区域统计误差</text><text font-size="22" fill="#25374C" x="888" y="404">身份连续性与遮挡后续接</text><text font-size="22" fill="#25374C" x="888" y="444">同时统计误连和未恢复</text><text font-size="22" fill="#25374C" x="888" y="484">端到端时延、掉帧与稳定性</text></g>
<g id="expected-outcome" data-pptx-bounds="64 568 1152 85"><text x="64" y="605" font-size="32" font-weight="bold" fill="#172B46">预期形成：两项空间方法与可配置的通用感知分析系统。</text><text x="64" y="642" font-size="22" fill="#596B80">猪只承担应用验证；跨类别与跨场景的有效性，通过独立数据评价。</text></g>
