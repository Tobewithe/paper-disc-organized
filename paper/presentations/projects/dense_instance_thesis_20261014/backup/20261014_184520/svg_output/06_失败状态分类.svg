<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#315E9D">02 研究方法 · 模块一</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">先分清框与轮廓的成败，才能选对改进对象</text></g>
<g id="pairing-rule" data-pptx-bounds="64 168 1152 44"><text x="64" y="197" font-size="22" fill="#596B80">IoU 衡量预测与标注的重合程度；先以框 IoU≥0.50 固定同类别预测，未配对单列。</text></g>
<g id="failure-states" data-pptx-bounds="64 224 1152 310">
 <rect x="64" y="224" width="1152" height="44" fill="#F1F5F8"/>
 <g font-size="22" font-weight="bold" fill="#172B46"><text x="80" y="254">观测状态</text><text x="340" y="254">同一预测的判定</text><text x="790" y="254">对实验的作用</text></g>
 <g fill="#25374C"><text x="80" y="304">无配对</text><text x="340" y="304" font-size="22">未分配同类 Box50 预测</text><text x="790" y="304" font-size="22">先追查候选与匹配</text></g>
 <line x1="64" y1="320" x2="1216" y2="320" stroke="#D4DEE7"/>
 <g fill="#25374C"><text x="80" y="356">框差 · 轮廓差</text><text x="340" y="356" font-size="22">Box&lt;0.75；Mask&lt;0.75</text><text x="790" y="356" font-size="22">联合检查定位与分割</text></g>
 <line x1="64" y1="372" x2="1216" y2="372" stroke="#D4DEE7"/>
 <g fill="#25374C"><text x="80" y="408">框差 · 轮廓好</text><text x="340" y="408" font-size="22">Box&lt;0.75；Mask≥0.75</text><text x="790" y="408" font-size="22">避免把框差等同于分割差</text></g>
 <rect x="64" y="424" width="1152" height="52" fill="#F1F5F8"/>
 <g fill="#007F82"><text x="80" y="460" font-weight="bold">框好 · 轮廓差</text><text x="340" y="460" font-size="22">Box≥0.75；Mask&lt;0.75</text><text x="790" y="460" font-size="22">进一步查支持与轮廓生成</text></g>
 <g fill="#25374C"><text x="80" y="512">框好 · 轮廓好</text><text x="340" y="512" font-size="22">Box≥0.75；Mask≥0.75</text><text x="790" y="512" font-size="22">保留成功参照，检查损伤</text></g>
</g>
<g id="box-support" data-pptx-bounds="64 551 1152 97"><text x="64" y="583" fill="#315E9D" font-weight="bold">框支持率 = 框内有效标注面积 ÷ 有效目标标注面积</text><text x="64" y="629" font-size="22" fill="#596B80">历史以 0.95 分层，排查目标区域是否覆盖不足；它是几何代理，不直接判定裁切原因。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">[D1] Box / Mask 指框 / 轮廓 IoU；复用历史固定预测诊断定义，当前 O2O 任务失败分组见下一页。</text><text x="1216" y="689" text-anchor="end">06 / 25</text></g>
