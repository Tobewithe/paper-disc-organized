<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">02 研究现状与关键问题</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">掩码质量评估与局部精细化研究</text></g>
<g id="quality-scoring" data-pptx-bounds="64 180 574 118"><text x="64" y="215" font-size="32" font-weight="bold" fill="#172B46">实例掩码质量估计</text><text x="64" y="257" font-size="22" fill="#596B80">Mask Scoring R-CNN（CVPR 2019）</text><text x="64" y="289" font-size="22" fill="#25374C">预测掩码 IoU，形成质量感知的实例评分。</text></g>
<g id="boundary-refinement" data-pptx-bounds="64 321 574 118"><text x="64" y="356" font-size="32" font-weight="bold" fill="#172B46">高分辨率局部边界细化</text><text x="64" y="398" font-size="22" fill="#596B80">Boundary Patch Refinement（CVPR 2021）</text><text x="64" y="430" font-size="22" fill="#25374C">提取预测边界附近的图像块进行精细化。</text></g>
<g id="selective-refinement" data-pptx-bounds="64 462 574 123"><text x="64" y="497" font-size="32" font-weight="bold" fill="#172B46">易错区域的选择性处理</text><text x="64" y="539" font-size="22" fill="#596B80">Mask Transfiner（CVPR 2022）</text><text x="64" y="571" font-size="22" fill="#25374C">以四叉树组织边界区域，重点修正易错节点。</text></g>
<g id="operation-benefit" data-pptx-bounds="692 184 524 393"><rect x="692" y="184" width="524" height="393" fill="#F1F5F8" /><text x="724" y="232" font-size="22" fill="#007F82">本课题的研究切入点</text><text font-size="40" font-weight="bold" fill="#172B46" x="724" y="306">面向具体操作的</text><text font-size="40" font-weight="bold" fill="#172B46" x="724" y="364">修正收益估计</text><line x1="724" y1="402" x2="1184" y2="402" stroke="#D4DEE7" stroke-width="2" /><text x="724" y="457" fill="#25374C">质量评分不能替代收益估计</text><text font-size="22" fill="#596B80" x="724" y="510">当前掩码质量与修正后的质量变化</text><text font-size="22" fill="#596B80" x="724" y="544">具有不同的预测目标。</text></g>
<g id="scope" data-pptx-bounds="64 605 1152 38"><text x="64" y="631" font-size="22" fill="#007F82">研究衔接：结合操作响应与邻接信息，进行实例级的修正收益预测与选择。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">参考：Huang et al.（2019）；Tang et al.（2021）；Ke et al.（2022）</text><text x="1216" y="689" text-anchor="end">06 / 13</text></g>
</svg>