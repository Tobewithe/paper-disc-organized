<g id="same-operation" data-pptx-bounds="64 539 1152 102"><rect x="64" y="539" width="1152" height="102" fill="#F1F5F8"/><text x="88" y="583" font-size="32" font-weight="bold" fill="#172B46">关键挑战：缺少真实标注时，预测具体修正的净收益</text><text x="88" y="621" font-size="22" fill="#596B80">接触位置的像素归属存在歧义，邻接预测也含误差，需要兼顾错误修复与正确区域保护。</text></g>
