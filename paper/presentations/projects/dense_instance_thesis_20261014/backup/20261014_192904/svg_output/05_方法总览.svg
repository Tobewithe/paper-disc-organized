<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#315E9D">02 研究方法</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">三个模块衔接单帧识别与连续身份记录</text></g>
<g id="module-one" data-pptx-bounds="64 187 1152 111"><text x="64" y="233" font-size="40" font-weight="bold" fill="#315E9D">01</text><text x="166" y="224" font-size="32" font-weight="bold" fill="#172B46">密集场景下的个体检测与实例分割</text><text x="166" y="277" fill="#25374C">在一张图中找到个体，并分清各自轮廓。</text><text x="1216" y="277" font-size="22" text-anchor="end" fill="#315E9D">已有图像实验</text></g>
<g id="module-two" data-pptx-bounds="64 325 1152 111"><line x1="166" y1="325" x2="1216" y2="325" stroke="#D4DEE7"/><text x="64" y="378" font-size="40" font-weight="bold" fill="#007F82">02</text><text x="166" y="369" font-size="32" font-weight="bold" fill="#172B46">连续视频中的身份关联与稳定保持</text><text x="166" y="422" fill="#25374C">个体持续可见时，尽量保持同一个编号。</text><text x="1216" y="422" font-size="22" text-anchor="end" fill="#007F82">拟开展</text></g>
<g id="module-three" data-pptx-bounds="64 470 1152 111"><line x1="166" y1="470" x2="1216" y2="470" stroke="#D4DEE7"/><text x="64" y="523" font-size="40" font-weight="bold" fill="#C36D37">03</text><text x="166" y="514" font-size="32" font-weight="bold" fill="#172B46">遮挡后的身份恢复与轨迹续接</text><text x="166" y="567" fill="#25374C">个体丢失后重新出现，判断能否接回原编号。</text><text x="1216" y="567" font-size="22" text-anchor="end" fill="#C36D37">拟开展</text></g>
<g id="scope" data-pptx-bounds="64 606 1152 42"><text x="166" y="636" font-size="22" fill="#596B80">视频研究先限定为单摄像头、固定视角，两个视频模块沿用同一跟踪框架。</text></g>
</svg>
