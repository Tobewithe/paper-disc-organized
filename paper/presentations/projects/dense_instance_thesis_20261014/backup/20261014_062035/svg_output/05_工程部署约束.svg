<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">01 研究背景 · 工程部署</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">连续视频部署需要兼顾稳定性与响应时延</text></g>
<g id="decision-columns" data-pptx-bounds="64 175 1152 39" font-size="22" fill="#596B80"><text x="64" y="201">工程决策</text><text x="395" y="201">收益与代价</text><text x="974" y="201">部署评价</text></g>
<g id="confirmation-latency" data-pptx-bounds="64 234 1152 100"><text x="64" y="268" font-size="32" font-weight="bold" fill="#172B46">输出确认</text><text x="64" y="313" font-size="22" fill="#596B80">连续观测后再激活轨迹</text><text x="395" y="265" fill="#25374C">减少短暂虚假目标<tspan x="395" dy="43" fill="#C36D37">确认等待增加响应时延</tspan></text><text x="974" y="265" font-size="22" fill="#596B80">虚假轨迹数量<tspan x="974" dy="39">首次确认时延</tspan></text></g>
<g id="retention-cost" data-pptx-bounds="64 360 1152 100"><line x1="64" y1="352" x2="1216" y2="352" stroke="#D4DEE7" /><text x="64" y="396" font-size="32" font-weight="bold" fill="#172B46">轨迹保留</text><text x="64" y="441" font-size="22" fill="#596B80">等待遮挡目标重新出现</text><text x="395" y="393" fill="#25374C">延长可尝试重关联的时间<tspan x="395" dy="43" fill="#C36D37">资源增加，外观变化仍可能使匹配失败</tspan></text><text x="974" y="393" font-size="22" fill="#596B80">正确续接与误连<tspan x="974" dy="39">内存及计算开销</tspan></text></g>
<g id="pipeline-capacity" data-pptx-bounds="64 488 1152 100"><line x1="64" y1="480" x2="1216" y2="480" stroke="#D4DEE7" /><text x="64" y="524" font-size="32" font-weight="bold" fill="#172B46">处理规模</text><text x="64" y="569" font-size="22" fill="#596B80">多路视频与更多目标</text><text x="395" y="521" fill="#25374C">检测、分割、关联共同占用预算<tspan x="395" dy="43" fill="#C36D37">高吞吐不能直接保证低端到端时延</tspan></text><text x="974" y="521" font-size="22" fill="#596B80">吞吐、时延与掉帧<tspan x="974" dy="39">并发容量与运行稳定性</tspan></text></g>
<g id="state-semantics" data-pptx-bounds="64 608 1152 38"><text x="64" y="636" font-size="22" font-weight="bold" fill="#172B46">统计口径：当前可见个体与丢失期间的预测轨迹分别记录，避免把预测当作观测。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" fill="#596B80" font-size="16"><text x="64" y="689">依据：NVIDIA DeepStream 跟踪器、Accuracy 与 OpenTelemetry 官方文档</text><text x="1216" y="689" text-anchor="end">05 / 15</text></g>
</svg>
