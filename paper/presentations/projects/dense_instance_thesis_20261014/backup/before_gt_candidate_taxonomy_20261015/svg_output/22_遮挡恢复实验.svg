<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#C36D37">02 研究方法 · 模块三 · 拟开展</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">遮挡恢复的实验设想</text></g>
<g id="event-definition" data-pptx-bounds="64 163 1152 48"><text x="64" y="195" font-size="22" fill="#596B80">标注遮挡开始、重新可见与真实 ID；按事前固定的遮挡时长分层比较。</text></g>
<g id="recovery-ablations" data-pptx-bounds="64 228 1152 300"><text x="64" y="256" font-weight="bold" fill="#172B46">拟比较的配置</text><text x="674" y="256" font-weight="bold" fill="#172B46">分离的影响因素</text><line x1="64" y1="276" x2="1216" y2="276" stroke="#D4DEE7" stroke-width="2" />
<g fill="#25374C"><text x="64" y="320">① 原跟踪器的默认丢失保留</text><text x="674" y="320">当前框架本身的恢复能力</text><line x1="64" y1="341" x2="1216" y2="341" stroke="#D4DEE7" />
<text x="64" y="385">② 仅延长轨迹保留时间</text><text x="674" y="385">单纯等待更久能改善多少</text><line x1="64" y1="406" x2="1216" y2="406" stroke="#D4DEE7" />
<text x="64" y="450">③ 同预算下加入可靠外观记忆</text><text x="674" y="450">记忆能否减少认错与漏恢复</text><line x1="64" y1="471" x2="1216" y2="471" stroke="#D4DEE7" />
<text x="64" y="515">④ 再加入连续多帧确认</text><text x="674" y="515">降低误接是否会增加恢复延迟</text></g></g>
<g id="event-metrics" data-pptx-bounds="64 548 1152 105"><text x="64" y="580" font-weight="bold" fill="#172B46">同一批重现事件：正确恢复、错误续接、未恢复；另报延迟与超时。</text><text x="64" y="623" font-size="22" fill="#596B80">三类结果共用全部合格事件分母；加入新目标进入、出画重入等干扰对照。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">实验尚未开展；只把身份可标定的重现计入恢复机会；阈值、时限和评价窗口在运行前固定。</text><text x="1216" y="689" text-anchor="end">22 / 25</text></g>
</svg>
