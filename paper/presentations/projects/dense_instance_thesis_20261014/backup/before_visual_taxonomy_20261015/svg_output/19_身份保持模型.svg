<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">02 研究方法 · 模块二 · 拟开展</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">连续视频中的身份关联与稳定保持</text></g>
<g id="research-question" data-pptx-bounds="64 163 1152 48"><text x="64" y="195" font-size="22" fill="#596B80">研究个体交叉、外观相似和短暂漏检时，如何减少编号切换与轨迹断裂。</text></g>
