<g id="model-plan" data-pptx-bounds="64 551 1152 98"><text x="64" y="584" font-weight="bold" fill="#172B46">基线采用 ByteTrack，参照 BoT-SORT 研究运动与外观的联合关联。</text><text x="64" y="630" font-size="22" fill="#596B80">轮廓需明确用于外观提取或关联；仅替换掩码，不会自动改善纯检测框跟踪。</text></g>
