<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#596B80" /></marker></defs>
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#C36D37">02 研究方法 · 模块三 · 拟开展</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">遮挡后的身份恢复与轨迹续接</text></g>
<g id="recovery-question" data-pptx-bounds="64 163 1152 48"><text x="64" y="195" font-size="22" fill="#596B80">重点处理已丢失的轨迹：目标重新出现时，判断能否可靠地接回原 ID。</text></g>
<g id="proposed-recovery" data-pptx-bounds="64 230 1152 295">
<rect x="64" y="261" width="199" height="96" fill="#F1F5F8" /><text x="163.5" y="300" text-anchor="middle" fill="#172B46">正在跟踪</text><text x="163.5" y="338" text-anchor="middle" font-size="22" fill="#596B80">持续更新原 ID</text>
<rect x="341" y="261" width="245" height="96" fill="#F1F5F8" /><text x="463.5" y="300" text-anchor="middle" fill="#172B46">遮挡后保留记忆</text><text x="463.5" y="338" text-anchor="middle" font-size="22" fill="#596B80">外观、位置与运动历史</text>
<rect x="665" y="261" width="259" height="96" fill="#FFFFFF" stroke="#C36D37" stroke-width="2" /><text x="794.5" y="300" text-anchor="middle" fill="#172B46">重现候选待确认</text><text x="794.5" y="338" text-anchor="middle" font-size="22" fill="#596B80">筛选候选，连续观测</text>
<rect x="1004" y="261" width="212" height="96" fill="#007F82" /><text x="1110" y="300" text-anchor="middle" fill="#FFFFFF">恢复原 ID</text><text x="1110" y="338" text-anchor="middle" font-size="22" fill="#FFFFFF">续接遮挡前记录</text>
<g stroke="#596B80" stroke-width="2"><line x1="263" y1="309" x2="337" y2="309" marker-end="url(#arrow)" /><line x1="586" y1="309" x2="661" y2="309" marker-end="url(#arrow)" /><line x1="924" y1="309" x2="1000" y2="309" marker-end="url(#arrow)" /><line x1="794.5" y1="357" x2="794.5" y2="423" marker-end="url(#arrow)" /></g>
<text x="303" y="251" text-anchor="middle" font-size="22" fill="#596B80">丢失</text><text x="625" y="251" text-anchor="middle" font-size="22" fill="#596B80">重现</text><text x="964" y="251" text-anchor="middle" font-size="22" fill="#007F82">可信</text>
<rect x="665" y="428" width="551" height="87" fill="#F7F9FB" /><text x="689" y="464" font-size="22" fill="#C36D37">证据不足：保留未确认状态，继续观察。</text><text x="689" y="500" font-size="22" fill="#596B80">到达固定时限后终止旧轨迹，避免强行接错。</text>
<text x="64" y="439" font-size="22" font-weight="bold" fill="#172B46">沿用模块二的跟踪框架</text><text x="64" y="480" font-size="22" fill="#596B80">增加丢失轨迹记忆与恢复判定</text>
</g>
<g id="recovery-principle" data-pptx-bounds="64 552 1152 98"><text x="64" y="585" font-weight="bold" fill="#172B46">关键问题是“接回正确个体”，同时控制误接和长期悬而未决。</text><text x="64" y="630" font-size="22" fill="#596B80">遮挡期间的位置预测应标为推测；只有重新观测后，才能确认身份与轨迹续接。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">拟研究框架，尚未实现或验证；以单摄像头内的临时遮挡与重现为主。</text><text x="1216" y="689" text-anchor="end">18 / 22</text></g>
</svg>
