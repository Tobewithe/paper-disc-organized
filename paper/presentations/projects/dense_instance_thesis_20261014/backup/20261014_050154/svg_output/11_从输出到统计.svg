<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">04 通用系统设计与应用</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">实例感知结果与场景统计的关联</text></g>
<g id="count" data-pptx-bounds="64 185 372 334"><text x="64" y="218" font-size="32" font-weight="bold" fill="#315E9D">可见实例计数</text><g fill="none" stroke="#315E9D" stroke-width="3"><rect x="98" y="266" width="74" height="93"/><rect x="197" y="286" width="74" height="93"/><rect x="296" y="251" width="74" height="93"/></g><text x="64" y="431" fill="#25374C">对保留实例逐一计数。<tspan x="64" dy="44">分析遗漏与重复检出误差。</tspan></text></g>
<g id="individual-region" data-pptx-bounds="463 185 352 334"><text x="463" y="218" font-size="32" font-weight="bold" fill="#007F82">个体可见区域</text><ellipse cx="585" cy="319" rx="72" ry="57" fill="#315E9D" fill-opacity="0.25" stroke="#315E9D" stroke-width="2"/><ellipse cx="685" cy="319" rx="72" ry="57" fill="#007F82" fill-opacity="0.25" stroke="#007F82" stroke-width="2"/><text x="568" y="329" fill="#315E9D">A</text><text x="688" y="329" fill="#007F82">B</text><text x="463" y="431" fill="#25374C">掩码表示个体可见范围。<tspan x="463" dy="44">评价像素归属和边界。</tspan></text></g>
<g id="union-region" data-pptx-bounds="866 185 350 334"><text x="866" y="218" font-size="32" font-weight="bold" fill="#172B46">区域前景占用</text><rect x="887" y="253" width="308" height="139" fill="#F1F5F8" stroke="#596B80" stroke-dasharray="8,4" stroke-width="2"/><ellipse cx="995" cy="319" rx="72" ry="57" fill="#007F82"/><ellipse cx="1090" cy="319" rx="72" ry="57" fill="#007F82"/><text x="866" y="431" fill="#25374C">计算 ROI 内的掩码并集。<tspan x="866" dy="44">输出区域内前景占比。</tspan></text></g>
<g id="statistical-scope" data-pptx-bounds="64 543 1152 57"><rect x="64" y="543" width="1152" height="57" fill="#F1F5F8"/><text x="88" y="581" font-size="22" fill="#25374C">像素只在相邻实例之间重新归属时，个体区域会改变，整体前景占比可能不变。</text></g>
<g id="existing-foundation" data-pptx-bounds="64 613 1152 38"><text x="64" y="639" font-size="22" fill="#596B80">统计对象：图像中的可见实例及其像素区域；视频任务按帧生成统计结果。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">ROI：感兴趣区域</text><text x="1216" y="689" text-anchor="end">11 / 13</text></g>
