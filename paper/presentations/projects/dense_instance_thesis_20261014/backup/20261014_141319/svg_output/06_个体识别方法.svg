<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#315E9D">02 研究方法</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">方法一：减少漏检和重复识别</text></g>
<g id="two-individuals" data-pptx-bounds="64 178 552 343"><text x="64" y="215" font-size="32" font-weight="bold" fill="#172B46">两个个体挨得很近</text><ellipse cx="255" cy="337" rx="97" ry="74" fill="#315E9D" fill-opacity="0.18" stroke="#315E9D" stroke-width="3" /><ellipse cx="355" cy="350" rx="97" ry="74" fill="#007F82" fill-opacity="0.18" stroke="#007F82" stroke-width="3" /><rect x="141" y="247" width="228" height="174" fill="none" stroke="#315E9D" stroke-width="2" /><rect x="241" y="261" width="228" height="174" fill="none" stroke="#007F82" stroke-width="2" /><text x="205" y="348" fill="#315E9D">A</text><text x="384" y="363" fill="#007F82">B</text><text x="64" y="493" fill="#25374C">预测重叠较多，但两个都需要保留。</text></g>
<g id="one-individual" data-pptx-bounds="666 178 550 343"><text x="666" y="215" font-size="32" font-weight="bold" fill="#172B46">同一个体出现多个预测</text><ellipse cx="944" cy="344" rx="166" ry="80" fill="#F1F5F8" stroke="#596B80" stroke-width="2" stroke-dasharray="8 4" /><ellipse cx="871" cy="344" rx="67" ry="54" fill="#315E9D" fill-opacity="0.25" stroke="#315E9D" stroke-width="2" /><ellipse cx="1017" cy="344" rx="67" ry="54" fill="#315E9D" fill-opacity="0.25" stroke="#315E9D" stroke-width="2" /><text x="829" y="354" fill="#315E9D">预测 1</text><text x="975" y="354" fill="#315E9D">预测 2</text><text x="795" y="452" font-size="22" fill="#596B80">虚线表示同一个体的可见范围</text><text x="666" y="493" fill="#25374C">预测不完全重叠，仍可能重复计数。</text></g>
<g id="proposed-selection" data-pptx-bounds="64 553 1152 96"><line x1="64" y1="553" x2="1216" y2="553" stroke="#D4DEE7" stroke-width="2" /><text x="64" y="597" font-size="32" font-weight="bold" fill="#315E9D">结合预测完整性和邻近关系，决定保留哪些结果。</text><text x="64" y="637" font-size="22" fill="#596B80">验证重点：是否减少个体遗漏，同时减少重复识别。</text></g>
