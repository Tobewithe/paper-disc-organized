<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#315E9D">02 研究方法 · 模块一</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">用实例级指标定位错误并衡量修正代价</text></g>
<g id="target-definition" data-pptx-bounds="64 185 1152 77"><text x="64" y="230" font-size="32" font-weight="bold" fill="#315E9D">目标集合 T</text><text x="364" y="230" fill="#25374C">分割任务失败，框达标、同一检测的轮廓未达标。</text></g>
<g id="gain-definition" data-pptx-bounds="64 280 1152 78"><line x1="64" y1="281" x2="1216" y2="281" stroke="#D4DEE7" /><text x="64" y="330" font-size="32" font-weight="bold" fill="#315E9D">修正增益 ΔIoU</text><text x="364" y="330" fill="#25374C">修正后 IoU − 修正前 IoU，按图平均。</text></g>
<g id="damage-definition" data-pptx-bounds="64 380 1152 78"><line x1="64" y1="381" x2="1216" y2="381" stroke="#D4DEE7" /><text x="64" y="430" font-size="32" font-weight="bold" fill="#315E9D">成功损伤率</text><text x="364" y="430" fill="#25374C">原成功实例中，修正后分割任务失败的比例。</text></g>
<g id="overlap-definition" data-pptx-bounds="64 480 1152 78"><line x1="64" y1="481" x2="1216" y2="481" stroke="#D4DEE7" /><text x="64" y="530" font-size="32" font-weight="bold" fill="#315E9D">邻框重叠度</text><text x="364" y="530" fill="#25374C">当前框与邻近输出框的最大 IoU。</text></g>
<g id="metric-notes" data-pptx-bounds="64 579 1152 67" font-size="22" fill="#596B80"><text x="64" y="603">IoU 为预测区域与标注区域的交并比；框与轮廓的诊断阈值均为 0.75。</text><text x="64" y="637">邻框不限类别，排除同 raw 的副本；它反映预测框重叠，不等同于真实密度。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">自定义诊断口径基于现有 IoU 与匹配结果；完整方法效果仍需同配置 COCO AP 验收。[E0—E4]</text><text x="1216" y="689" text-anchor="end">06 / 15</text></g>
