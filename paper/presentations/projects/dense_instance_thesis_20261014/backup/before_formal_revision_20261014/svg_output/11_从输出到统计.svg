<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">应用链路 / 方法为什么有用</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">把算法输出转化为可核对的数量与区域</text></g>
<g id="count" data-pptx-bounds="64 185 372 334"><text x="64" y="218" font-size="32" font-weight="bold" fill="#315E9D">实例集合 → 可见数量</text><g fill="none" stroke="#315E9D" stroke-width="3"><rect x="98" y="266" width="74" height="93"/><rect x="197" y="286" width="74" height="93"/><rect x="296" y="251" width="74" height="93"/></g><text x="64" y="431" fill="#25374C">是否漏掉个体？<tspan x="64" dy="44">是否把一个目标计了两次？</tspan></text></g>
<g id="individual-region" data-pptx-bounds="463 185 352 334"><text x="463" y="218" font-size="32" font-weight="bold" fill="#007F82">实例掩码 → 个体区域</text><ellipse cx="585" cy="319" rx="72" ry="57" fill="#315E9D" fill-opacity="0.25" stroke="#315E9D" stroke-width="2"/><ellipse cx="685" cy="319" rx="72" ry="57" fill="#007F82" fill-opacity="0.25" stroke="#007F82" stroke-width="2"/><text x="568" y="329" fill="#315E9D">A</text><text x="688" y="329" fill="#007F82">B</text><text x="463" y="431" fill="#25374C">像素是否归属正确？<tspan x="463" dy="44">细节是否被保留？</tspan></text></g>
<g id="union-region" data-pptx-bounds="866 185 350 334"><text x="866" y="218" font-size="32" font-weight="bold" fill="#172B46">掩码并集 → 区域占用</text><rect x="887" y="253" width="308" height="139" fill="#F1F5F8" stroke="#596B80" stroke-dasharray="8,4" stroke-width="2"/><ellipse cx="995" cy="319" rx="72" ry="57" fill="#007F82"/><ellipse cx="1090" cy="319" rx="72" ry="57" fill="#007F82"/><text x="866" y="431" fill="#25374C">指定区域内前景并集<tspan x="866" dy="44">占该图像区域的比例。</tspan></text></g>
<g id="statistical-scope" data-pptx-bounds="64 543 1152 57"><rect x="64" y="543" width="1152" height="57" fill="#F1F5F8"/><text x="88" y="581" font-size="22" fill="#25374C">像素只在相邻实例之间重新归属时，个体区域会改变，整体前景占比可能不变。</text></g>
<g id="existing-foundation" data-pptx-bounds="64 613 1152 38"><text x="64" y="639" font-size="22" fill="#596B80">已有基础：候选追踪与分层评价工具、RCMC 修正原型、动物案例数据；详细实验放在备用页。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">预期作用需验证。图为指标定义示意；可见数量不含无法观测的完全遮挡目标。</text><text x="1216" y="689" text-anchor="end">11 / 13</text></g>
</svg>
