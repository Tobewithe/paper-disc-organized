<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">方向二 / 已有研究走到哪里</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">“当前有多好”与“这次改得值不值”</text></g>
<g id="quality-scoring" data-pptx-bounds="64 180 574 118"><text x="64" y="215" font-size="32" font-weight="bold" fill="#172B46">估计当前质量</text><text x="64" y="257" font-size="22" fill="#596B80">Mask Scoring R-CNN · CVPR 2019</text><text x="64" y="285" font-size="22" fill="#25374C">预测 Mask IoU，校准掩码与分类分数。</text></g>
<g id="boundary-refinement" data-pptx-bounds="64 321 574 118"><text x="64" y="356" font-size="32" font-weight="bold" fill="#172B46">细化局部边界</text><text x="64" y="398" font-size="22" fill="#596B80">Boundary Patch Refinement · CVPR 2021</text><text x="64" y="426" font-size="22" fill="#25374C">提取边界附近高分辨率图像块进行修正。</text></g>
<g id="selective-refinement" data-pptx-bounds="64 462 574 115"><text x="64" y="497" font-size="32" font-weight="bold" fill="#172B46">聚焦易错区域</text><text x="64" y="539" font-size="22" fill="#596B80">Mask Transfiner · CVPR 2022</text><text x="64" y="567" font-size="22" fill="#25374C">使用四叉树，重点处理检测出的易错节点。</text></g>
<g id="operation-benefit" data-pptx-bounds="692 184 524 393"><rect x="692" y="184" width="524" height="393" fill="#F1F5F8"/><text x="724" y="232" font-size="22" fill="#007F82">本课题进一步聚焦</text><text x="724" y="306" font-size="40" font-weight="bold" fill="#172B46">一次具体修正，<tspan x="724" dy="58">是否值得采用？</tspan></text><line x1="724" y1="402" x2="1184" y2="402" stroke="#D4DEE7" stroke-width="2"/><text x="724" y="457" fill="#25374C">质量差 ≠ 某种操作一定有效</text><text x="724" y="510" font-size="22" fill="#596B80">把原状态、操作响应与邻接信息<tspan x="724" dy="34">用于具体操作的收益判断。</tspan></text></g>
<g id="scope" data-pptx-bounds="64 605 1152 38"><text x="64" y="631" font-size="22" fill="#C36D37">研究边界：质量感知、边界细化、选择性处理均已有基础；新增信息的作用需对照验证。</text></g>
