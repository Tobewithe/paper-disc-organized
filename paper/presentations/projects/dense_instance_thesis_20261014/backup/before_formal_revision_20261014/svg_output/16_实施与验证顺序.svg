<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="ending">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#596B80">备用 C / 毕业论文实施路径</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">从可复用原型出发，逐层验证到系统</text></g>
<g id="protocol-first" data-pptx-bounds="64 180 1152 82"><text x="64" y="230" font-size="40" font-weight="bold" fill="#172B46">01</text><text x="158" y="224" font-size="32" font-weight="bold" fill="#172B46">统一口径</text><text x="422" y="224" fill="#25374C">固定模型、样本分组、候选预算与评价规则。</text></g>
<g id="independent-modules" data-pptx-bounds="64 279 1152 82"><text x="64" y="329" font-size="40" font-weight="bold" fill="#315E9D">02</text><text x="158" y="323" font-size="32" font-weight="bold" fill="#315E9D">分别验证</text><text x="422" y="323" fill="#25374C">候选关系选择对照；修正收益的邻居特征消融。</text></g>
<g id="combined-evaluation" data-pptx-bounds="64 378 1152 82"><text x="64" y="428" font-size="40" font-weight="bold" fill="#007F82">03</text><text x="158" y="422" font-size="32" font-weight="bold" fill="#007F82">组合检验</text><text x="422" y="422" fill="#25374C">基线、两个单模块与组合，同条件比较。</text></g>
<g id="system-validation" data-pptx-bounds="64 477 1152 82"><text x="64" y="527" font-size="40" font-weight="bold" fill="#172B46">04</text><text x="158" y="521" font-size="32" font-weight="bold" fill="#172B46">应用确认</text><text x="422" y="521" fill="#25374C">猪只案例独立确认，测试统计误差与系统稳定性。</text></g>
<g id="next-step" data-pptx-bounds="64 577 1152 66"><rect x="64" y="577" width="1152" height="66" fill="#172B46"/><text x="88" y="620" fill="#FFFFFF">下一步：固定毕业论文比较口径，并把基线推理接入统一接口。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 665 1152 35" font-size="16" fill="#596B80"><text x="64" y="689">实施建议，不代表实验已启动；与期刊论文的系数纠错研究线分别管理。</text><text x="1216" y="689" text-anchor="end">备用 C</text></g>
</svg>
