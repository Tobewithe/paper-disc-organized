<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">02 研究方法</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">研究方法的总体安排</text></g>
<g id="method-one" data-pptx-bounds="64 194 530 219"><text x="64" y="224" font-size="22" fill="#315E9D">方法研究一</text><text x="64" y="277" font-size="32" font-weight="bold" fill="#315E9D">减少漏检与重复识别</text><text x="64" y="337" fill="#25374C">判断哪些预测代表不同个体<tspan x="64" dy="46">保留更合理的一组识别结果</tspan></text></g>
<g id="method-two" data-pptx-bounds="686 194 530 219"><text x="686" y="224" font-size="22" fill="#007F82">方法研究二</text><text x="686" y="277" font-size="32" font-weight="bold" fill="#007F82">改善相邻个体的轮廓</text><text x="686" y="337" fill="#25374C">判断局部修改是否有帮助<tspan x="686" dy="46">选择采用修正或保留原结果</tspan></text></g>
<g id="video-integration" data-pptx-bounds="64 447 1152 103"><line x1="64" y1="447" x2="1216" y2="447" stroke="#D4DEE7" stroke-width="2" /><text x="64" y="494" font-size="32" font-weight="bold" fill="#172B46">视频集成与验证</text><text x="440" y="494" fill="#25374C">接入已有跟踪方法，检查遮挡前后的身份续接。</text></g>
<g id="validation-order" data-pptx-bounds="64 588 1152 58"><text x="64" y="627" fill="#596B80">先分别验证每项方法，再观察它们在完整视频中的作用。</text></g>
