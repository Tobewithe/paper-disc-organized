<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" font-size="28" data-pptx-page-role="content">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#596B80" stroke-width="1.5" /></marker></defs>
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="title" data-pptx-bounds="64 42 1152 108"><text x="64" y="65" font-size="22" fill="#007F82">02 研究方法</text><text x="64" y="122" font-size="40" font-weight="bold" fill="#172B46">方法二：改善相邻个体的轮廓</text></g>
<g id="helpful-change" data-pptx-bounds="64 180 552 333"><text x="64" y="217" font-size="32" font-weight="bold" fill="#007F82">删去错分区域，轮廓更准确</text><ellipse cx="189" cy="347" rx="72" ry="80" fill="#007F82" fill-opacity="0.2" stroke="#007F82" stroke-width="3" /><rect x="236" y="306" width="58" height="80" fill="#C36D37" fill-opacity="0.5" /><line x1="313" y1="347" x2="380" y2="347" stroke="#596B80" stroke-width="2" marker-end="url(#arrow)" /><ellipse cx="481" cy="347" rx="72" ry="80" fill="#007F82" fill-opacity="0.2" stroke="#007F82" stroke-width="3" /><text x="161" y="355" fill="#007F82">个体</text><text x="453" y="355" fill="#007F82">个体</text><text x="64" y="483" fill="#25374C">去掉本来属于邻居的区域。</text></g>
<g id="harmful-change" data-pptx-bounds="666 180 550 333"><text x="666" y="217" font-size="32" font-weight="bold" fill="#C36D37">删去正确细节，结果反而变差</text><ellipse cx="791" cy="347" rx="72" ry="80" fill="#007F82" fill-opacity="0.2" stroke="#007F82" stroke-width="3" /><rect x="838" y="323" width="59" height="43" fill="#007F82" fill-opacity="0.25" stroke="#007F82" stroke-width="2" /><rect x="849" y="314" width="52" height="63" fill="none" stroke="#C36D37" stroke-dasharray="4 4" stroke-width="2" /><line x1="914" y1="347" x2="981" y2="347" stroke="#596B80" stroke-width="2" marker-end="url(#arrow)" /><ellipse cx="1082" cy="347" rx="72" ry="80" fill="#007F82" fill-opacity="0.2" stroke="#007F82" stroke-width="3" /><text x="763" y="355" fill="#007F82">个体</text><text x="1054" y="355" fill="#007F82">个体</text><text x="666" y="483" fill="#25374C">误删当前个体自身的真实部分。</text></g>
<g id="selective-correction" data-pptx-bounds="64 548 1152 101"><line x1="64" y1="548" x2="1216" y2="548" stroke="#D4DEE7" stroke-width="2" /><text x="64" y="594" font-size="32" font-weight="bold" fill="#007F82">先提出局部修改，再判断是否值得采用。</text><text x="64" y="635" font-size="22" fill="#596B80">综合原有轮廓、修改幅度与相邻个体信息，选择修正或保留原结果。</text></g>
