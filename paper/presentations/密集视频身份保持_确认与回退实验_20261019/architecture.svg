<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700"><rect width="1500" height="700" fill="#f3f6fa"/><style>text{font-family:Microsoft YaHei,sans-serif;fill:#19344f}.h{font-size:30px;font-weight:700}.t{font-size:22px}.n{font-size:18px;fill:#597086}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#5c7896"/></marker></defs><text x="55" y="65" class="h">固定运动轨迹 + 可撤销身份账本</text><text x="55" y="105" class="n">本轮待验证设计；补接有局部收益，时序确认与回退的独立增量尚未成立</text><rect x="55" y="180" width="250" height="125" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="73" y="225" class="t" font-weight="700">检测 / 分割前端</text><text x="73" y="264" class="n">YOLO26m-seg · 权重冻结</text><rect x="370" y="180" width="250" height="125" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="388" y="225" class="t" font-weight="700">运动轨迹</text><text x="388" y="264" class="n">ByteTrack · 框与观测固定</text><rect x="685" y="180" width="250" height="125" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="703" y="225" class="t" font-weight="700">输出缓冲</text><text x="703" y="264" class="n">最多 4 帧 · 历史不可改</text><rect x="1000" y="180" width="440" height="125" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="1018" y="225" class="t" font-weight="700">发布个体 ID + 轮廓</text><text x="1018" y="264" class="n">同一观测数 · 可追溯身份变更</text><rect x="370" y="400" width="250" height="130" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="388" y="445" class="t" font-weight="700">历史身份锚点</text><text x="388" y="484" class="n">近 5 次特征 · 64D 身份头</text><rect x="685" y="400" width="250" height="130" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="703" y="445" class="t" font-weight="700">提议 → 多帧确认</text><text x="703" y="484" class="n">3次确认 · 超时用原ID</text><rect x="1000" y="400" width="440" height="130" rx="16" fill="white" stroke="#cedae7" stroke-width="2"/><text x="1018" y="445" class="t" font-weight="700">监测矛盾 → 撤销别名</text><text x="1018" y="484" class="n">回到原运动 ID；不污染运动状态</text><path d="M305 240 H365" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M620 240 H680" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M935 240 H995" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M495 305 V395" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M620 465 H680" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M935 465 H995" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M810 400 V310" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><path d="M1220 400 V310" fill="none" stroke="#5c7896" stroke-width="3" marker-end="url(#a)"/><text x="55" y="615" class="t">本轮可检验贡献：将身份接回做成有记录、可撤销的决策，并量化纠错与误撤销的代价。</text><text x="55" y="656" class="n">GT 仅用于事后评价与原图复核；不进入推理。零新增训练参数。一般确认 / 回退已有先例，不宣称首次。</text></svg>